<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>Forest Routes · Map visualization</title>
<style>
:root{
  --paper:#ebe6dc; --sheet:#f7f3ea; --ink:#1a211c; --muted:#5c675f; --rule:#c5beb2;
  --forest:#25553a; --route:#1f6b4c; --walk:#b85a28; --map:#d7e0d6; --warn:#8a2f24;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, #dfe8d8 0%, transparent 55%),
    linear-gradient(135deg, #e7e1d4 0%, #ebe6dc 40%, #e2ddd2 100%);
  font:15px/1.5 Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
}
.shell{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.top{
  display:flex;justify-content:space-between;gap:20px;align-items:end;
  padding:18px 22px 14px;border-bottom:1px solid var(--rule);
  background:color-mix(in srgb, var(--sheet) 88%, transparent);
}
.brand{font:700 13px/1.2 ui-monospace,"Cascadia Mono","SF Mono",Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
h1{margin:6px 0 0;font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.top p{margin:6px 0 0;max-width:42ch;color:var(--muted);font-size:14px}
.badge{font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--walk);border:1px solid #d2b39a;padding:8px 10px;background:var(--sheet)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.panel{
  padding:18px 18px 24px;border-right:1px solid var(--rule);background:var(--sheet);
  overflow:auto;
}
label{display:block;margin:16px 0 6px;font:600 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input,button{
  width:100%;font:15px/1.3 Georgia,Palatino,serif;padding:11px 12px;
  border:1px solid #9aa39a;background:#fffdf8;color:var(--ink);border-radius:2px;
}
button{
  margin-top:16px;background:var(--forest);color:#f4f7f2;border-color:var(--forest);
  cursor:pointer;font:600 14px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase;
}
button:hover{filter:brightness(1.05)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule);margin-top:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tools button{margin-top:0}
#result{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
#result .ok{font:700 18px/1.2 Georgia,serif;color:var(--forest)}
#result .warn{font:700 18px/1.2 Georgia,serif;color:var(--warn)}
#result dl{display:grid;gap:10px;margin:14px 0 0}
#result dl div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--rule);padding-bottom:6px}
#result dt{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#result dd{margin:0;font:600 14px/1 ui-monospace,Menlo,monospace}
#result .fine,#result p{color:var(--muted);font-size:13px;margin:10px 0 0}
.mapwrap{position:relative;min-height:0;background:var(--map)}
canvas{display:block;width:100%;height:100%;min-height:560px;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.hint{
  position:absolute;left:14px;bottom:14px;z-index:2;
  background:color-mix(in srgb, var(--sheet) 92%, transparent);
  border:1px solid var(--rule);padding:8px 10px;font:12px/1.35 ui-monospace,Menlo,monospace;color:var(--muted);
}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font:12px/1 ui-monospace,Menlo,monospace;color:var(--muted)}
.legend i{width:16px;height:3px;display:inline-block;background:var(--c)}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .panel{border-right:0;border-bottom:1px solid var(--rule)}
  canvas{min-height:420px}
  .top{align-items:start;flex-direction:column}
}
:focus-visible{outline:2px solid var(--walk);outline-offset:2px}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="brand">Forest Routes · Challenge 3</div>
      <h1>Map visualization</h1>
      <p>Offline municipal graph. Scroll to zoom, drag to pan. Routes are geometric candidates only.</p>
    </div>
    <div class="badge">Private · no network</div>
  </header>
  <div class="layout">
    <aside class="panel">
      <label for="stage">Graph policy</label>
      <select id="stage"><option value="before">Screened candidates · 150 m gaps</option></select>
      <label for="journey">Journey</label>
      <select id="journey"></select>
      <label for="walk">Walking allowance / end (m)</label>
      <input id="walk" type="number" min="0" max="3000" step="100" value="1000">
      <button id="compute" type="button">Compute route</button>
      <div class="tools">
        <button class="ghost" id="fit" type="button">Fit route</button>
        <button class="ghost" id="network" type="button">Fit network</button>
        <button class="ghost" id="zoomIn" type="button">Zoom +</button>
        <button class="ghost" id="zoomOut" type="button">Zoom −</button>
      </div>
      <div id="result" aria-live="polite"></div>
      <div class="legend">
        <span><i style="--c:#3f6b4a"></i>OSM</span>
        <span><i style="--c:#5a7078"></i>PrevisIA</span>
        <span><i style="--c:#1f6b4c"></i>Route</span>
        <span><i style="--c:#b85a28"></i>Walk</span>
        <span><i style="--c:#8f4a45"></i>Gap</span>
      </div>
    </aside>
    <section class="mapwrap">
      <canvas id="map" aria-label="Road geometry and computed route"></canvas>
      <div class="hint">Scroll = zoom · Drag = pan · Fit route resets view</div>
    </section>
  </div>
</div>
<script>__ROUTER__</script>
<script>window.DEMO_DATA={before:__GRAPH__};</script>
<script>__UI__</script>
</body>
</html>
